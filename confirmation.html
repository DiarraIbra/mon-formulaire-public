<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmation d'envoi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg text-center">
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100">
            <svg class="h-6 w-6 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
        </div>
        
        <h1 class="text-3xl font-bold text-gray-800 mt-4">Merci, <span id="user-name"></span> !</h1>
        <p class="text-gray-600 mt-2 mb-6">Vos informations ont été envoyées avec succès. Nous avons bien reçu votre message.</p>
        
        <a href="index.html" class="inline-block px-6 py-3 border border-transparent text-base font-medium rounded-lg text-white bg-blue-600 hover:bg-blue-700">
            Retour au formulaire
        </a>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const prenom = urlParams.get('prenom');
            const userNameElement = document.getElementById('user-name');
            
            if (prenom && userNameElement) {
                userNameElement.textContent = prenom.charAt(0).toUpperCase() + prenom.slice(1);
            } else if (userNameElement) {
                userNameElement.textContent = "visiteur";
            }
        };
    </script>

</body>
</html>
