<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulaire de Contact</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-lg mx-auto bg-white p-8 rounded-xl shadow-lg">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Contacter le support</h1>
        <p class="text-gray-600 mb-6">Remplissez ce formulaire pour nous envoyer vos informations.</p>
        
        <form id="contactForm">
            <div class="space-y-6">
                <div>
                    <label for="nom" class="block text-sm font-medium text-gray-700">Nom</label>
                    <input type="text" id="nom" name="nom" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                </div>
                <div>
                    <label for="prenom" class="block text-sm font-medium text-gray-700">Prénom</label>
                    <input type="text" id="prenom" name="prenom" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                </div>
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700">Adresse e-mail</label>
                    <input type="email" id="email" name="email" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150">
                </div>
                <div>
                    <label for="message" class="block text-sm font-medium text-gray-700">Votre message</label>
                    <textarea id="message" name="message" rows="4" required class="mt-1 block w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition duration-150" placeholder="Si votre message est urgent, écrivez le mot 'urgent' ici..."></textarea>
                </div>
            </div>
            <div class="mt-8">
                <button type="submit" id="submitButton" class="w-full inline-flex justify-center items-center px-6 py-3 border border-transparent text-base font-medium rounded-lg shadow-sm text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-transform transform hover:scale-105">
                    Envoyer les informations
                </button>
            </div>
        </form>
        <div id="statusMessage" class="mt-6 text-center text-sm font-medium rounded-lg p-3" style="display: none;"></div>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        const submitButton = document.getElementById('submitButton');
        const statusMessage = document.getElementById('statusMessage');
        const N8N_WEBHOOK_URL = 'https://ibrahimadiarra.app.n8n.cloud/webhook-test/ca9599ca-865c-4ee2-8de2-9a60c2b05267';

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            submitButton.disabled = true;
            submitButton.textContent = 'Envoi en cours...';

            const formData = new FormData(form);
            const data = {
                nom: formData.get('nom'),
                prenom: formData.get('prenom'),
                email: formData.get('email'),
                message: formData.get('message'),
            };

            try {
                const response = await fetch(N8N_WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                if (!response.ok) {
                    throw new Error(`Erreur du serveur: ${response.statusText}`);
                }
                
                window.location.href = `confirmation.html?prenom=${encodeURIComponent(data.prenom)}`;

            } catch (error) {
                console.error('Erreur lors de l\'envoi:', error);
                statusMessage.textContent = 'Une erreur est survenue. Veuillez réessayer plus tard.';
                statusMessage.className = 'mt-6 text-center text-sm font-medium rounded-lg p-3 bg-red-100 text-red-800';
                statusMessage.style.display = 'block';
                submitButton.disabled = false;
                submitButton.textContent = 'Envoyer les informations';
            }
        });
    </script>
</body>
</html>
